[package]
name = "enhanced-gmail-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A Gmail Model Context Protocol server backed by google-gmail1"
license = "MIT"

[dependencies]
anyhow = "1.0"
axum = "0.8"
base64 = "0.22"
google-gmail1 = "7.0.0"
html2text = "0.16"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "3.5.1", features = ["transport-streamable-http-server"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
subtle = "2.6"
tokio = { version = "1.48", features = ["fs", "macros", "net", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
rmcp = { version = "3.5.1", features = ["client"] }
tempfile = "3.23"
tower = { version = "0.5", features = ["util"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4.2", default-features = false, features = ["v1"] }
